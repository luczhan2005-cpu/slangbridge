# Render Blueprint: New > Blueprint > pick this repo. Render asks for the secret values below.
services:
  - type: web
    name: slangbridge
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Fill ONE provider in the Render dashboard (never commit keys).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_10MIN
        value: "150"
